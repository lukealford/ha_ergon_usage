name: Ergon Usage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r ergon_usage/requirements.txt -r ergon_usage/requirements-dev.txt
      - name: Run tests
        run: python -m pytest ergon_usage/tests -q
        working-directory: .
      - name: Byte-compile application package
        run: python -m compileall -q ergon_usage/app
        working-directory: .
