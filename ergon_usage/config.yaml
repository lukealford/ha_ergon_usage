name: Ergon Usage
version: "0.5.0"
slug: ergon_usage
description: Securely collect and view Ergon electricity usage.
url: https://github.com/lukealford/ha_ergon_usage
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
homeassistant_api: true
options:
  poll_interval_hours: 12
  initial_history_days: 365
  backfill_batch_days: 30
  request_delay_seconds: 3
  retry_limit: 5
  tariff_name_overrides: "{}"
  backfill_current_rate: false
  # Tariffs to split into off-peak (9pm-11am), daytime (11am-4pm) and
  # peak (4pm-9pm) statistics.  Blank = default (Tariff 11).  Multiple
  # tariffs comma-separated.
  tou_tariffs: "Tariff 11"
  # Optional (YYYY-MM-DD): back-charge the daily supply charge from this
  # date (e.g. the start of your billing period) to reconcile HA costs
  # with your Ergon bill.  Blank = charge supply from first observation.
  supply_start_date: ""
  # Day of month your Ergon bill period starts (1-28).  Set this and the
  # add-on automatically reconciles supply costs each billing rollover —
  # no monthly maintenance.  0 = disabled (use supply_start_date).
  bill_day_of_month: 0
schema:
  ergon_email: email
  ergon_password: password
  poll_interval_hours: int(6,48)
  initial_history_days: int(1,730)
  backfill_batch_days: int(1,60)
  request_delay_seconds: int(0,60)
  retry_limit: int(0,10)
  # HA's schema language has no `dict` type; the override map is provided as
  # a JSON object string and parsed by the app ({"Tariff 11": "T11"}).
  tariff_name_overrides: str
  # When true, usage recorded before the first observed rate boundary is
  # priced at the current (latest) rate instead of being left uncosted.
  backfill_current_rate: bool
  # Tariffs to split into off-peak (9pm-11am), daytime (11am-4pm) and
  # peak (4pm-9pm) statistics, comma-separated.  Blank = default.
  tou_tariffs: str
  # Back-charge daily supply from this date (YYYY-MM-DD). Blank = off.
  supply_start_date: str?
  # Day of month the bill period starts (1-28); 0 = disabled.
  bill_day_of_month: int(0,28)
